<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="df-title df-desc">
  <title id="df-title">Dual-fuel heat pump switchover diagram</title>
  <desc id="df-desc">Diagram showing the operating cost of a heat pump and a gas furnace as outdoor temperature falls, with the switchover point where the furnace becomes cheaper to run.</desc>
  <style>
    .axis { stroke: #1a1a1a; stroke-width: 1; fill: none; }
    .grid { stroke: #e6e1d8; stroke-width: 1; fill: none; }
    .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: #4a4a4a; }
    .axis-title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #1a1a1a; }
    .heatpump { fill: none; stroke: #b6431f; stroke-width: 2.4; }
    .furnace { fill: none; stroke: #1a1a1a; stroke-width: 2.4; }
    .switchover { fill: none; stroke: #2c6e49; stroke-width: 2; stroke-dasharray: 5 3; }
  </style>

  <rect width="720" height="420" fill="#fbfaf7" />

  <text x="360" y="30" class="axis-title" text-anchor="middle">Dual-fuel switchover: where the gas furnace wins</text>

  <!-- chart area: x 80..680, y 60..360 -->
  <line x1="80" y1="60"  x2="680" y2="60"  class="grid" />
  <line x1="80" y1="135" x2="680" y2="135" class="grid" />
  <line x1="80" y1="210" x2="680" y2="210" class="grid" />
  <line x1="80" y1="285" x2="680" y2="285" class="grid" />

  <line x1="80" y1="60" x2="80" y2="360" class="axis" />
  <text x="72" y="64"  class="label" text-anchor="end">low</text>
  <text x="72" y="214" class="label" text-anchor="end">cost</text>
  <text x="72" y="364" class="label" text-anchor="end">high</text>
  <text x="36" y="210" class="axis-title" transform="rotate(-90 36 210)" text-anchor="middle">Operating cost per BTU</text>

  <!-- X axis: -20..10 C, switchover around -7C -->
  <line x1="80" y1="360" x2="680" y2="360" class="axis" />
  <text x="80"  y="380" class="label" text-anchor="middle">-20</text>
  <text x="213" y="380" class="label" text-anchor="middle">-15</text>
  <text x="346" y="380" class="label" text-anchor="middle">-10</text>
  <text x="480" y="380" class="label" text-anchor="middle">-5</text>
  <text x="613" y="380" class="label" text-anchor="middle">0</text>
  <text x="380" y="405" class="axis-title" text-anchor="middle">Outdoor temperature (C)</text>

  <!-- Heat pump curve: low cost on right (warm), rising to left (cold) -->
  <polyline class="heatpump"
    points="613,310 480,250 346,180 213,110 80,70"
    fill="none" />

  <!-- Gas furnace: flat-ish, slightly rising on cold side -->
  <polyline class="furnace"
    points="613,260 480,250 346,225 213,205 80,185"
    fill="none" />

  <!-- Switchover marker around -7C (between 346 and 480, roughly 413) -->
  <line x1="413" y1="60" x2="413" y2="360" class="switchover" />
  <text x="413" y="55" class="label" fill="#2c6e49" text-anchor="middle">Switchover ~ -7C</text>

  <text x="100" y="105" class="label" fill="#b6431f">Heat pump (rising cost as COP falls)</text>
  <text x="100" y="160" class="label" fill="#1a1a1a">Gas furnace (roughly flat)</text>

  <text x="80" y="395" class="label" fill="#6f6f6f">Below the switchover temperature, the gas furnace is cheaper to run. Above it, the heat pump wins.</text>
</svg>