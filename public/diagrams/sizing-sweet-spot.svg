<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="sizing-title sizing-desc">
  <title id="sizing-title">Heat pump sizing sweet spot</title>
  <desc id="sizing-desc">Diagram showing seasonal efficiency versus heat pump size, with an undersized, correctly sized, and oversized scenario. Correct sizing at 10 to 15 percent above Manual J design day gives the best seasonal COP.</desc>
  <style>
    .axis { stroke: #1a1a1a; stroke-width: 1; fill: none; }
    .grid { stroke: #e6e1d8; stroke-width: 1; fill: none; }
    .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: #4a4a4a; }
    .axis-title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #1a1a1a; }
    .curve { fill: none; stroke: #1a1a1a; stroke-width: 1.4; stroke-dasharray: 4 3; }
    .sweet { fill: #2c6e49; opacity: 0.18; }
    .bar-unused { fill: #6f6f6f; opacity: 0.85; }
    .bar-correct { fill: #2c6e49; opacity: 0.85; }
    .bar-over { fill: #b6431f; opacity: 0.85; }
  </style>

  <rect width="720" height="460" fill="#fbfaf7" />

  <text x="360" y="32" class="axis-title" text-anchor="middle">Right-size: aim 10 to 15 percent above Manual J design day</text>

  <!-- Y axis: seasonal COP from 1.8 to 3.4 -->
  <line x1="80" y1="60" x2="80" y2="340" class="axis" />
  <line x1="80" y1="60"  x2="680" y2="60"  class="grid" />
  <line x1="80" y1="130" x2="680" y2="130" class="grid" />
  <line x1="80" y1="200" x2="680" y2="200" class="grid" />
  <line x1="80" y1="270" x2="680" y2="270" class="grid" />

  <text x="72" y="64"  class="label" text-anchor="end">3.4</text>
  <text x="72" y="134" class="label" text-anchor="end">3.0</text>
  <text x="72" y="204" class="label" text-anchor="end">2.6</text>
  <text x="72" y="274" class="label" text-anchor="end">2.2</text>
  <text x="72" y="344" class="label" text-anchor="end">1.8</text>
  <text x="32" y="200" class="axis-title" transform="rotate(-90 32 200)" text-anchor="middle">Seasonal COP</text>

  <!-- X axis: sized fraction of design load -->
  <line x1="80" y1="340" x2="680" y2="340" class="axis" />
  <text x="170" y="360" class="label" text-anchor="middle">75% (under)</text>
  <text x="350" y="360" class="label" text-anchor="middle">110% (sweet spot)</text>
  <text x="560" y="360" class="label" text-anchor="middle">150% (over)</text>
  <text x="380" y="385" class="axis-title" text-anchor="middle">Installed capacity as % of Manual J design day load</text>

  <!-- Efficiency curve: peak around 110% -->
  <path class="curve" d="M 120 280 Q 350 75, 590 200" />

  <!-- Sweet spot band -->
  <rect x="295" y="60" width="105" height="280" class="sweet" />
  <text x="347" y="90" class="label" fill="#2c6e49" text-anchor="middle">+10 to +15%</text>
  <text x="347" y="108" class="label" fill="#2c6e49" text-anchor="middle">best seasonal COP</text>

  <!-- Three markers -->
  <circle cx="170" cy="250" r="8" class="bar-unused" />
  <text x="170" y="240" class="label" text-anchor="middle" fill="#6f6f6f">Burns backup</text>
  <text x="170" y="253" class="label" text-anchor="middle" fill="#6f6f6f">on cold snaps</text>

  <circle cx="350" cy="100" r="8" class="bar-correct" />
  <text x="350" y="90" class="label" text-anchor="middle" fill="#2c6e49">Carries winter</text>

  <circle cx="560" cy="180" r="8" class="bar-over" />
  <text x="560" y="170" class="label" text-anchor="middle" fill="#b6431f">Short-cycles,</text>
  <text x="560" y="183" class="label" text-anchor="middle" fill="#b6431f">loses 10 to 15% COP</text>

  <text x="80" y="425" class="label" fill="#6f6f6f">Undersized units call on resistive backup through the coldest 50 hours of winter. oversized units short-cycle and age faster.</text>
  <text x="80" y="443" class="label" fill="#6f6f6f">Manual J figure tightens the guesswork. Air sealing and insulation first, then size.</text>
</svg>